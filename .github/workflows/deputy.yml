# Deputy caller — the ONLY Deputy file that lives in a target repo.
# The pipelines live in Ami-Khokhar/deputy; this routes events to them. Fixes to
# the reusable workflows reach every repo automatically. Copy this to
# .github/workflows/deputy.yml on the repo's DEFAULT branch (install.sh does it).
#
# Triggers:
#   - label an issue `agent:ready`            → implement the issue → PR
#   - comment `@deputy [notes]` on an issue   → same as the label
#   - comment `@deputy <instruction>` on a PR → revise that PR's branch in place
# @deputy comments only fire for repo owners/members/collaborators (security:
# otherwise anyone could spend your Claude token).
name: deputy

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  # Issue flow: label, or @deputy on an issue (not a PR).
  issue:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'agent:ready') ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
       contains(github.event.comment.body, '@deputy') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    uses: Ami-Khokhar/deputy/.github/workflows/deputy.yml@main
    with:
      verify: ${{ vars.DEPUTY_VERIFY }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # PR flow: @deputy on a pull request → revise the PR's branch in place.
  pr:
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      contains(github.event.comment.body, '@deputy') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: Ami-Khokhar/deputy/.github/workflows/deputy-pr.yml@main
    with:
      verify: ${{ vars.DEPUTY_VERIFY }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
