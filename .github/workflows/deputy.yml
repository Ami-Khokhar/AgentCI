# Deputy caller — the ONLY Deputy file that lives in a target repo.
# The whole pipeline lives in Ami-Khokhar/deputy; this just calls it. Fixes to
# the reusable workflow reach every repo automatically. Copy this to
# .github/workflows/deputy.yml on the repo's DEFAULT branch (install.sh does it).
name: deputy

on:
  issues:
    types: [labeled]

jobs:
  deputy:
    # Fire only for the ready label; every other labeled event is ignored.
    if: github.event.label.name == 'agent:ready'
    # The reusable workflow inherits exactly these permissions.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    # Pin @main for latest, or a tag like @v1 for stability.
    uses: ./.github/workflows/_deputy-lib.yml
    with:
      # The deterministic gate. MUST run green in a fresh CI runner:
      # self-provision the toolchain and install every dep needed to collect
      # tests. Set the DEPUTY_VERIFY variable on this repo (install.sh does it).
      # Examples: "npm ci && npm test" · "cargo test" · "go test ./..."
      verify: ${{ vars.DEPUTY_VERIFY }}
    # Pass the token explicitly (cross-repo `secrets: inherit` is unreliable on
    # personal accounts). This repo needs the CLAUDE_CODE_OAUTH_TOKEN secret.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
